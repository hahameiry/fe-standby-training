<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>父子组件计数器</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>

<div id="app">
  <h2>总数：{{ total }}</h2>
  <counter @add="handleAdd"></counter>
  <counter @add="handleAdd"></counter>
  <counter @add="handleAdd"></counter>
</div>

<script>
  // 子组件
  Vue.component('counter', {
    template: `
      <div>
        <span>子组件计数：{{ count }}</span>
        <button @click="increment">+1</button>
      </div>
    `,
    data() {
      return { count: 0 }
    },
    methods: {
      increment() {
        this.count++
        this.$emit('add')
      }
    }
  })

  // 父组件
  new Vue({
    el: '#app',
    data: {
      total: 0
    },
    methods: {
      handleAdd() {
        this.total++
      }
    }
  })
</script>

</body>
</html>
